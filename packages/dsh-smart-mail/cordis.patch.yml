# dsh-smart-mail bundle patch.
#
# One row, one package: the Host half (index.js) registers the send_email /
# read_emails tools and the background IMAP poller; the browser half
# (client.js) contributes the 「智能邮箱」 panel under settings.plugins.tab
# for account and whitelist management through the plugin's own HTTP routes.
- insert:
    - id: smart-mail
      name: 'dsh-smart-mail'
      config:
        # Wake behavior lives in config so it survives plugin reinstalls:
        #   enabled   - the poller starts with the Host (default)
        #   allowFrom - whitelist; empty means NO wake at all
        #   model     - 'default' follows DSH's current default model; or a
        #               concrete catalog id chosen in the panel
        enabled: true
        pollIntervalSec: 120
        # allowFrom - whitelist; empty means NO wake at all. Add your own
        # addresses here, or edit it later in the panel (settings -> plugins ->
        # smart mail). Exact address `user@x.com` or domain suffix `@x.com`.
        allowFrom: []
        model: default
        wakePrompt: '邮件白名单唤醒：全自动处理这封新邮件。理解发件人意图后直接行动：需要回信就调用 send_email 直接发送，不需要逐字确认；拿不准的信息按邮件上下文合理推断，全程禁止使用 ask_user_question 反问用户；处理完成后用两三句话总结你做了什么即可。如果邮件是通知/广告类无实质内容，简短归档说明后直接结束。'
        # wakeCwd - working directory for headless wake sessions; empty falls
        # back to the DSH process cwd. Set your own workspace path in the
        # panel or here, e.g. 'C:\Users\you\my-workspace'.

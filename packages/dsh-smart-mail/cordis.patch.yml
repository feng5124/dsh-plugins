# dsh-smart-mail bundle patch.
#
# One row, one package: the Host half (index.js) registers the send_email /
# read_emails tools and the background IMAP poller; the browser half
# (client.js) contributes the "智能邮箱" panel under settings.plugins.tab for
# accounts, whitelist, thread continuation, and log rotation.
#
# These are neutral defaults. Your own allowlist, workspace path, and wake
# prompt belong in the profile's own cordis.patch.yml (same row id, last write
# wins), or in the panel — never in this file.
- insert:
    - id: smart-mail
      name: 'dsh-smart-mail'
      config:
        # Start the IMAP poller with the Host.
        enabled: true
        # Seconds between polls (minimum 30).
        pollIntervalSec: 120
        # Whichever senders are listed here may wake a session; an empty list
        # means NO wake at all. Exact address (user@x.com) or domain suffix
        # (@x.com).
        allowFrom: []
        # 'default' follows DSH's current default model; or a concrete catalog id.
        model: default
        wakePrompt: '处理这封新邮件并按需回复。'
        # Working directory for sessions this plugin creates. Empty falls back
        # to the DSH process cwd; set your own workspace path here.
        # ---- same-thread reply continuation ----
        # Every outgoing message carries a [dsh-xxxx] subject tag; a reply is
        # resolved back to its session by References/In-Reply-To first, then
        # the X-DSH-Session header, then that tag.
        tagPrefix: '[dsh-'
        # Continue the thread's original session instead of starting a new one.
        continueThreads: true
        # If that session is running, replace its current turn before injecting.
        interruptSameThread: true
        # If that session was archived, restore it (workspaceRegistry) instead
        # of abandoning the thread.
        autoUnarchive: true
        # ---- activity log rotation: split by size or by day ----
        logMaxBytes: 2097152
        logKeepDays: 7
        logKeepFiles: 20
